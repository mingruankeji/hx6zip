[package]
name = "mzip-shell-extension"
version = "0.1.1"
edition = "2024"
rust-version = "1.93"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
mzip-shell-protocol = { path = "../shell-protocol" }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61.2"

[dev-dependencies]
tempfile = "3.27"
windows = { version = "0.61.3", features = ["Win32_UI_Shell_Common"] }
